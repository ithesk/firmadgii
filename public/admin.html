<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Servicio e-CF</title>
<style>
  :root {
    --papel: #f3f5f4; --hoja: #ffffff; --tinta: #14262e; --tinta-2: #51636b; --linea: #d5dcda;
    --sello: #0e6b62; --sello-f: #dff1ee; --ambar: #96590a; --ambar-f: #fbeccd; --rojo: #a8242b; --rojo-f: #f9e1e2;
    --foco: #1c6fd1;
    --radio: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --papel: #0f171a; --hoja: #172226; --tinta: #e6eeec; --tinta-2: #9bb0b0; --linea: #2b3b40;
      --sello: #5ccdbd; --sello-f: #12332f; --ambar: #f2b65c; --ambar-f: #3b2c0f; --rojo: #ff9a9e; --rojo-f: #44191c;
      --foco: #7fb6ff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 15px/1.5 "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 18px 16px 72px; }
  h1, h2, h3, p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .n { font-variant-numeric: tabular-nums; }
  .menor { color: var(--tinta-2); font-size: 13px; }

  /* Botones: uno principal por contexto; el resto, discretos; lo que corta el servicio, en rojo */
  .b { border: 1px solid var(--linea); background: var(--hoja); border-radius: var(--radio); padding: 7px 13px; cursor: pointer; font-weight: 500; }
  .b:hover { border-color: var(--tinta-2); }
  .b.principal { background: var(--tinta); color: var(--papel); border-color: var(--tinta); font-weight: 600; }
  .b.riesgo { color: var(--rojo); border-color: color-mix(in srgb, var(--rojo) 45%, var(--linea)); }
  .b.chico { padding: 4px 10px; font-size: 14px; }
  .b:disabled { opacity: .55; cursor: wait; }
  input[type=text], input[type=search], input[type=password], input[type=file], select {
    border: 1px solid var(--linea); background: var(--hoja); border-radius: var(--radio); padding: 7px 10px; min-width: 0; }

  /* Barra superior */
  .barra { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: space-between; }
  .barra h1 { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .barra .lado { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* Veredicto: lo único grande de la página */
  .veredicto { margin: 34px 0 6px; font-size: clamp(26px, 5vw, 38px); line-height: 1.15; font-weight: 650; letter-spacing: -.015em; text-wrap: balance; }
  .veredicto.mal { color: var(--rojo); }
  .veredicto.aviso { color: var(--ambar); }
  .pulso { color: var(--tinta-2); max-width: 60ch; }
  .urgente { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  h2.titulo { font-size: 13px; font-weight: 600; color: var(--tinta-2); margin: 34px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h2.titulo input { font-weight: 400; width: 190px; padding: 5px 9px; }

  /* Listas en hoja: atención y empresas */
  .lista { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; }
  .lista > * + * { border-top: 1px solid var(--linea); }
  .aviso-fila { display: flex; gap: 12px; align-items: center; padding: 11px 14px; }
  .aviso-fila .texto { flex: 1; min-width: 0; }
  .marca { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--sello); }
  .marca.aviso { background: var(--ambar); border-radius: 2px; transform: rotate(45deg); }
  .marca.mal { background: var(--rojo); border-radius: 2px; }
  .marca.apagada { background: transparent; border: 1.5px solid var(--tinta-2); }

  .empresa { display: grid; grid-template-columns: 9px minmax(0, 1fr) 96px 92px 92px 14px; gap: 14px; align-items: center;
    width: 100%; text-align: left; padding: 13px 14px; border: 0; background: transparent; cursor: pointer; }
  .empresa:hover, .empresa[aria-current=true] { background: color-mix(in srgb, var(--tinta) 5%, transparent); }
  .empresa .nombre { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empresa .dato b { display: block; font-weight: 600; }
  .empresa .dato span { display: block; color: var(--tinta-2); font-size: 12px; }
  .empresa .flecha { color: var(--tinta-2); }
  .empresa.suspendida .nombre, .empresa.suspendida .dato { opacity: .55; }
  .vacio { padding: 22px 14px; color: var(--tinta-2); }

  .etiqueta { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 3px; background: var(--sello-f); color: var(--sello); }
  .etiqueta.aviso { background: var(--ambar-f); color: var(--ambar); }
  .etiqueta.mal { background: var(--rojo-f); color: var(--rojo); }
  .etiqueta.neutra { background: color-mix(in srgb, var(--tinta) 8%, transparent); color: var(--tinta-2); }

  details.plegable { margin-top: 12px; }
  details.plegable > summary { cursor: pointer; color: var(--tinta-2); font-size: 14px; padding: 6px 0; }
  .ficha-datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 22px; padding: 8px 0 4px; font-size: 14px; }
  .ficha-datos span { color: var(--tinta-2); }

  .tabla { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td:first-child { white-space: nowrap; }
  th, td { text-align: left; padding: 7px 12px 7px 0; border-bottom: 1px solid var(--linea); vertical-align: top; }
  th { color: var(--tinta-2); font-weight: 500; font-size: 12px; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.larga { word-break: break-word; min-width: 150px; }

  /* Ficha de la empresa: lateral en escritorio, pantalla completa en móvil */
  #velo { position: fixed; inset: 0; background: rgba(8, 18, 22, .45); z-index: 20; }
  #ficha { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--papel); border-left: 1px solid var(--linea);
    z-index: 21; overflow-y: auto; padding: 16px 18px 40px; }
  @media (prefers-reduced-motion: no-preference) {
    #ficha.entra { animation: entra .18s ease-out; }
    @keyframes entra { from { transform: translateX(24px); opacity: 0; } }
  }
  .ficha-cabeza { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .ficha-cabeza h2 { font-size: 21px; line-height: 1.2; font-weight: 650; }
  .ficha-sub { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .bloque { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px; margin-top: 14px; }
  .bloque h3 { font-size: 13px; font-weight: 600; color: var(--tinta-2); margin-bottom: 10px; }
  .bloque.riesgo { border-color: color-mix(in srgb, var(--rojo) 30%, var(--linea)); }
  .cifras { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 12px; }
  .cifras div b { display: block; font-size: 24px; font-weight: 650; line-height: 1.2; }
  .cifras div span { color: var(--tinta-2); font-size: 12px; }
  .paso { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 4px 0; }
  .paso i { font-style: normal; font-weight: 700; }
  .ajuste { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 9px 0; }
  .ajuste + .ajuste { border-top: 1px solid var(--linea); }
  .ajuste p { color: var(--tinta-2); font-size: 13px; }
  .ajuste .b { flex: none; }
  .doc { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--linea); }
  .doc .b { flex: none; }
  .doc-arriba { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .buscador { display: flex; gap: 8px; margin-bottom: 10px; }
  .buscador input { flex: 1; }
  .nota { padding: 10px 12px; border-radius: var(--radio); background: var(--sello-f); color: var(--sello); font-size: 14px; margin-top: 10px; }
  .nota.mal { background: var(--rojo-f); color: var(--rojo); }
  .nota.aviso { background: var(--ambar-f); color: var(--ambar); }

  /* Diálogos y avisos pasajeros */
  dialog { border: 1px solid var(--linea); border-radius: 10px; background: var(--hoja); color: var(--tinta); padding: 20px; width: min(480px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(8, 18, 22, .55); }
  dialog h2 { font-size: 18px; margin-bottom: 10px; }
  dialog label { display: block; font-size: 13px; color: var(--tinta-2); margin: 12px 0 0; }
  dialog label input, dialog label select { display: block; width: 100%; margin-top: 4px; font-size: 15px; color: var(--tinta); }
  dialog .pie { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .secreto { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; padding: 10px; border: 1px dashed var(--tinta-2); border-radius: var(--radio); user-select: all; margin: 10px 0; }
  .fallo { color: var(--rojo); font-size: 14px; min-height: 1.4em; margin-top: 8px; }
  #franja { position: sticky; top: 0; z-index: 30; padding: 10px 16px; text-align: center; font-weight: 600; background: var(--rojo); color: #fff; }
  #pasajero { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 40; background: var(--tinta); color: var(--papel);
    padding: 10px 16px; border-radius: var(--radio); max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(8, 18, 22, .25); }

  #entrada { max-width: 380px; margin: 16vh auto 0; }
  #entrada h1 { font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
  #entrada input { width: 100%; margin: 18px 0 10px; padding: 10px 12px; }
  #entrada .b { width: 100%; padding: 10px; }

  @media (max-width: 640px) {
    .empresa { grid-template-columns: 9px minmax(0, 1fr) auto 14px; }
    .empresa .dato.hoy, .empresa .dato.mes { display: none; }
    .cifras { grid-template-columns: repeat(2, 1fr); row-gap: 12px; }
    h2.titulo input { width: 140px; }
    .ajuste { align-items: flex-start; flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>
<div id="franja" hidden></div>
<main>
  <section id="entrada" hidden>
    <h1>Servicio e-CF</h1>
    <p class="menor">Factura electrónica para varias empresas</p>
    <form id="formulario">
      <input id="clave" type="password" autocomplete="current-password" placeholder="Clave de administración" aria-label="Clave de administración" required>
      <button class="b principal" type="submit">Entrar</button>
    </form>
    <p class="fallo" id="aviso" role="alert"></p>
  </section>

  <section id="panel" hidden>
    <div class="barra">
      <h1>Servicio e-CF</h1>
      <div class="lado">
        <select id="mes" aria-label="Mes de las cifras"></select>
        <button class="b principal" id="nueva" type="button">Nueva empresa</button>
        <button class="b" id="salir" type="button">Salir</button>
      </div>
    </div>

    <p class="veredicto" id="veredicto" role="status"></p>
    <p class="pulso" id="pulso"></p>
    <div class="urgente" id="urgente"></div>

    <div id="zona-atencion" hidden>
      <h2 class="titulo">Requiere atención</h2>
      <div class="lista" id="atencion"></div>
    </div>

    <h2 class="titulo"><span id="titulo-empresas">Empresas</span><input id="filtro" type="search" placeholder="Buscar empresa o RNC" aria-label="Buscar empresa" hidden></h2>
    <div class="lista" id="empresas"></div>

    <details class="plegable" id="det-servicio">
      <summary>Detalles del servicio</summary>
      <div id="servicio"></div>
    </details>
    <details class="plegable" id="det-historial">
      <summary>Historial de acciones</summary>
      <div id="historial"></div>
    </details>
    <p class="menor" id="actualizado" style="margin-top:18px"></p>
  </section>
</main>

<div id="velo" hidden></div>
<aside id="ficha" hidden aria-label="Ficha de la empresa"></aside>
<dialog id="dialogo"></dialog>
<div id="pasajero" role="status" hidden></div>

<script>
(function () {
  'use strict';
  var CLAVE = 'ecf-admin';
  var $ = function (id) { return document.getElementById(id); };
  var reloj = null, ultimaBien = 0, datos = null, abierta = null, relojPasajero = null;
  var AMBIENTES = [['test', 'Pruebas (TesteCF)'], ['cert', 'Certificación (CerteCF)'], ['prod', 'Producción']];

  /* ---------- utilidades. Todo texto del servidor entra por textContent, nunca como HTML */
  function el(etiqueta, clase, texto) {
    var n = document.createElement(etiqueta);
    if (clase) n.className = clase;
    if (texto !== undefined && texto !== null) n.textContent = String(texto);
    return n;
  }
  function boton(texto, clase, accion) {
    var b = el('button', 'b ' + (clase || ''), texto);
    b.type = 'button';
    b.addEventListener('click', function (ev) { ev.stopPropagation(); accion(b); });
    return b;
  }
  var claveMemoria = '';
  function clave() { try { return sessionStorage.getItem(CLAVE) || claveMemoria; } catch (e) { return claveMemoria; } }
  function guardarClave(v) { claveMemoria = v; try { v ? sessionStorage.setItem(CLAVE, v) : sessionStorage.removeItem(CLAVE); } catch (e) {} }
  function minutos(iso) { return iso ? (Date.now() - new Date(iso).getTime()) / 60000 : Infinity; }
  function hace(iso) {
    if (!iso) return 'nunca';
    var m = Math.max(0, minutos(iso));
    if (m < 1.5) return 'hace un momento';
    if (m < 90) return 'hace ' + Math.round(m) + ' min';
    if (m < 2880) return 'hace ' + Math.round(m / 60) + ' h';
    return 'hace ' + Math.round(m / 1440) + ' días';
  }
  function fecha(iso) {
    return iso ? new Date(iso).toLocaleString('es-DO', { timeZone: 'America/Santo_Domingo', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }).replace(/\.$/, '') : '';
  }
  function dia(iso) { return iso ? new Date(iso).toLocaleDateString('es-DO', { day: 'numeric', month: 'long', year: 'numeric' }) : ''; }
  function plural(n, uno, varios) { return n + ' ' + (n === 1 ? uno : varios); }
  function nombreAmbiente(a) { return a === 'prod' ? 'Producción' : a === 'cert' ? 'Certificación' : a === 'test' ? 'Pruebas' : 'Sin ambiente'; }
  function humano(mensaje) {
    var m = String(mensaje || '');
    if (!m) return '';
    if (/fila se vació/i.test(m)) return 'Se descartó al vaciar la fila; Odoo lo reintenta.';
    if (/esperó demasiado en la fila/i.test(m)) return 'El servicio estaba ocupado y no llegó a enviarse; Odoo lo reintenta.';
    if (/timeout|ETIMEDOUT|ECONNABORTED/i.test(m)) return 'La DGII no respondió a tiempo.';
    if (/ENOTFOUND|ECONNREFUSED|ECONNRESET|network/i.test(m)) return 'No se pudo conectar con la DGII.';
    if (/Certificate not found/i.test(m)) return 'Falta el archivo del certificado.';
    if (/Error loading certificate|mac verify|invalid password/i.test(m)) return 'El certificado no abre con la clave guardada.';
    if (/401|unauthorized/i.test(m)) return 'La DGII rechazó el certificado.';
    return m.replace(/^Error [a-z ]+: /i, '');
  }
  function tabla(titulos, filas, larga) {
    var caja = el('div', 'tabla'), t = el('table'), tr = el('tr');
    titulos.forEach(function (x) { tr.appendChild(el('th', '', x)); });
    t.appendChild(tr);
    filas.forEach(function (celdas) {
      var f = el('tr');
      celdas.forEach(function (c, i) {
        var td = el('td', i === larga ? 'larga' : '');
        if (c && c.nodeType) td.appendChild(c); else td.textContent = c === undefined || c === null ? '' : String(c);
        f.appendChild(td);
      });
      t.appendChild(f);
    });
    caja.appendChild(t);
    return caja;
  }
  function pasajero(texto) {
    var p = $('pasajero'); p.textContent = texto; p.hidden = false;
    clearTimeout(relojPasajero); relojPasajero = setTimeout(function () { p.hidden = true; }, 5000);
  }
  function franja(texto) { var f = $('franja'); f.hidden = !texto; f.textContent = texto || ''; }

  /* ---------- llamadas: siempre con límite de tiempo, para que el panel nunca se quede esperando */
  function llamar(metodo, ruta, cuerpo, limite) {
    var control = new AbortController();
    var corte = setTimeout(function () { control.abort(); }, limite || 20000);
    var op = { method: metodo, headers: { 'x-api-key': clave() }, cache: 'no-store', signal: control.signal };
    if (cuerpo !== undefined) { op.headers['Content-Type'] = 'application/json'; op.body = JSON.stringify(cuerpo); }
    return fetch(ruta, op).then(function (r) {
      clearTimeout(corte);
      if (r.status === 401 || r.status === 403) { guardarClave(''); mostrarEntrada('Esa clave no es la de administración.'); throw new Error('Clave no válida'); }
      if (r.status === 429) { guardarClave(''); mostrarEntrada('Demasiados intentos desde esta conexión. Espere 15 minutos.'); throw new Error('Demasiados intentos'); }
      return r.json().catch(function () { throw new Error('El servicio devolvió una respuesta que no se entiende (HTTP ' + r.status + ')'); });
    }).then(function (j) {
      if (!j.success) throw new Error(j.error || 'Error');
      return j.data;
    }, function (e) {
      clearTimeout(corte);
      throw (e && e.name === 'AbortError') ? new Error('El servicio no respondió a tiempo') : e;
    });
  }
  function conBoton(b, promesa) {
    var texto = b.textContent;
    b.disabled = true; b.textContent = texto + '…';
    var fin = function () { b.disabled = false; b.textContent = texto; };
    return promesa.then(function (x) { fin(); return x; }, function (e) { fin(); throw e; });
  }

  /* ---------- diálogos */
  function dialogo(titulo, construir, textoAceptar, alAceptar, riesgo) {
    var d = $('dialogo'); d.textContent = '';
    var form = el('form'); form.method = 'dialog';
    form.appendChild(el('h2', '', titulo));
    var campos = construir(form) || {};
    var fallo = el('p', 'fallo'); fallo.setAttribute('role', 'alert');
    form.appendChild(fallo);
    var pie = el('div', 'pie');
    var cancelar = el('button', 'b', alAceptar ? 'Cancelar' : 'Cerrar'); cancelar.type = 'button';
    cancelar.addEventListener('click', function () { d.close(); });
    pie.appendChild(cancelar);
    var aceptar = null;
    if (alAceptar) { aceptar = el('button', 'b ' + (riesgo ? 'riesgo' : 'principal'), textoAceptar); aceptar.type = 'submit'; pie.appendChild(aceptar); }
    form.appendChild(pie);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (!alAceptar) return;
      fallo.textContent = '';
      var p;
      try { p = Promise.resolve(alAceptar(campos)); } catch (e) { p = Promise.reject(e); }
      conBoton(aceptar, p).then(function () { d.close(); }, function (e) { fallo.textContent = e.message || String(e); });
    });
    d.appendChild(form);
    d.showModal();
  }
  function campo(form, etiqueta, tipo, valor, atributos) {
    var l = el('label', '', etiqueta);
    var i = el(tipo === 'select' ? 'select' : 'input');
    if (tipo !== 'select') i.type = tipo;
    if (valor !== undefined) i.value = valor;
    for (var k in (atributos || {})) i.setAttribute(k, atributos[k]);
    l.appendChild(i); form.appendChild(l);
    return i;
  }
  function opciones(select, lista, actual) {
    lista.forEach(function (o) { var op = el('option', '', o[1]); op.value = o[0]; select.appendChild(op); });
    if (actual) select.value = actual;
  }
  function confirmar(titulo, texto, textoAceptar, accion, riesgo) {
    dialogo(titulo, function (f) { f.appendChild(el('p', '', texto)); }, textoAceptar, accion, riesgo);
  }
  function leerArchivo(entrada) {
    return new Promise(function (bien, mal) {
      var a = entrada.files && entrada.files[0];
      if (!a) return bien('');
      if (a.size > 100000) return mal(new Error('Ese archivo es demasiado grande para ser un certificado'));
      var lector = new FileReader();
      lector.onload = function () { bien(String(lector.result).split(',')[1] || ''); };
      lector.onerror = function () { mal(new Error('No se pudo leer el archivo')); };
      lector.readAsDataURL(a);
    });
  }
  function mostrarClave(rnc, apiKey, nota) {
    dialogo('Clave de API de ' + rnc, function (f) {
      f.appendChild(el('p', '', 'Cópiela ahora y póngala en el Odoo de la empresa. No se vuelve a mostrar.'));
      f.appendChild(el('div', 'secreto', apiKey));
      f.appendChild(boton('Copiar clave', 'chico', function (b) {
        if (navigator.clipboard) navigator.clipboard.writeText(apiKey).then(function () { b.textContent = 'Clave copiada'; });
      }));
      if (nota) f.appendChild(el('p', 'menor', nota)).style.marginTop = '12px';
    });
  }

  /* ---------- qué requiere atención: se calcula de los datos, no se escribe a mano */
  function problemas(d) {
    var lista = [];
    var arranque = minutos(d.servicio.fila.arranque);
    d.empresas.forEach(function (e) {
      if (!e.activa) return;
      var c = e.certificado || {}, a = e.actividad || { mes: {}, hoy: {} }, b = e.bandeja || {};
      var pon = function (grave, texto, accion, seccion) { lista.push({ grave: grave, rnc: e.rnc, nombre: e.nombre, texto: texto, accion: accion, seccion: seccion }); };

  function consultar(b, cuerpo) {
    var e = empresa();
    conBoton(b, llamar('POST', '/api/admin/empresas/' + e.rnc + '/consultar', cuerpo, 70000)).then(function (d) {
      dialogo('Respuesta de la DGII', function (f) {
        if (!d.resultado.length) f.appendChild(el('p', '', 'La DGII no tiene ese comprobante: nunca le llegó, o es de otro ambiente.'));
        d.resultado.forEach(function (r) {
          var caja = el('div', 'ficha-datos');
          [['Comprobante', r.encf], ['Estado', r.estado], ['TrackId', r.trackId], ['Recibido', r.fechaRecepcion]].forEach(function (p) {
            if (!p[1]) return; var x = el('div'); x.appendChild(el('span', '', p[0] + ': ')); x.appendChild(document.createTextNode(p[1])); caja.appendChild(x);
          });
          f.appendChild(caja);
          if (r.detalle) f.appendChild(el('p', 'nota aviso', r.detalle));
        });
      });
    }, function (err) { dialogo('La DGII no contestó', function (f) { f.appendChild(el('p', '', humano(err.message))); }); });
  }
  function editar() {
    var e = empresa();
    dialogo('Editar empresa', function (f) {
      var nombre = campo(f, 'Razón social', 'text', e.nombre, { maxlength: 150, required: '' });
      var ambiente = campo(f, 'Ambiente de la DGII', 'select'); opciones(ambiente, AMBIENTES, e.ambiente);
      f.appendChild(el('p', 'menor', 'En Producción los comprobantes son reales ante la DGII.')).style.marginTop = '8px';
      return { nombre: nombre, ambiente: ambiente };
    }, 'Guardar cambios', function (c) {
      return llamar('PATCH', '/api/admin/empresas/' + e.rnc, { nombre: c.nombre.value, ambiente: c.ambiente.value }).then(function () { pasajero('Cambios guardados.'); return cargar(); });
    });
  }
  function suspender() {
    var e = empresa();
    if (e.activa) confirmar('Suspender ' + e.nombre, 'Su clave deja de funcionar al momento: su Odoo no podrá emitir ni recibir comprobantes hasta que la reactive. No se borra nada.', 'Suspender', function () {
      return llamar('PATCH', '/api/admin/empresas/' + e.rnc, { activa: false }).then(function () { pasajero(e.nombre + ' está suspendida.'); return cargar(); });
    }, true);
    else confirmar('Reactivar ' + e.nombre, 'Su clave de siempre vuelve a funcionar.', 'Reactivar', function () {
      return llamar('PATCH', '/api/admin/empresas/' + e.rnc, { activa: true }).then(function () { pasajero(e.nombre + ' vuelve a estar activa.'); return cargar(); });
    });
  }
  function nuevaClave() {
    var e = empresa();
    confirmar('Generar clave nueva', 'La clave actual de ' + e.nombre + ' deja de funcionar al momento. Su Odoo no podrá facturar hasta que le ponga la nueva.', 'Generar clave', function () {
      return llamar('POST', '/api/admin/empresas/' + e.rnc + '/clave').then(function (d) { setTimeout(function () { mostrarClave(d.rnc, d.apiKey); }, 60); cargar(); });
    }, true);
  }
  function certificado() {
    var e = empresa();
    dialogo('Certificado de ' + e.nombre, function (f) {
      f.appendChild(el('p', 'menor', 'Antes de guardarlo se comprueba que abre con su clave y que no está vencido. El anterior se conserva en el servidor.'));
      var archivo = campo(f, 'Archivo .p12', 'file', undefined, { accept: '.p12,.pfx', required: '' });
      var clave = campo(f, 'Clave del certificado', 'password', '', { autocomplete: 'off', required: '' });
      return { archivo: archivo, clave: clave };
    }, 'Guardar certificado', function (c) {
      return leerArchivo(c.archivo).then(function (b64) {
        return llamar('POST', '/api/admin/empresas/' + e.rnc + '/certificado', { certificadoBase64: b64, claveCertificado: c.clave.value }, 30000);
      }).then(function (d) {
        partes.notaCert = el('p', 'nota', 'Certificado guardado. Pulse «Probar conexión» para confirmar que la DGII lo acepta.');
        pasajero('Certificado guardado: vence el ' + dia(d.certificado.vence) + '.');
        return cargar();
      });
    });
  }
  function nuevaEmpresa() {
    dialogo('Nueva empresa', function (f) {
      var rnc = campo(f, 'RNC', 'text', '', { inputmode: 'numeric', pattern: '[0-9]{9}|[0-9]{11}', required: '', maxlength: 11, title: '9 u 11 dígitos' });
      var nombre = campo(f, 'Razón social', 'text', '', { maxlength: 150, required: '' });
      var ambiente = campo(f, 'Ambiente de la DGII', 'select'); opciones(ambiente, AMBIENTES, 'cert');
      var archivo = campo(f, 'Certificado .p12 (se puede subir después)', 'file', undefined, { accept: '.p12,.pfx' });
      var clave = campo(f, 'Clave del certificado', 'password', '', { autocomplete: 'off' });
      return { rnc: rnc, nombre: nombre, ambiente: ambiente, archivo: archivo, clave: clave };
    }, 'Dar de alta', function (c) {
      return leerArchivo(c.archivo).then(function (b64) {
        var cuerpo = { rnc: c.rnc.value.trim(), nombre: c.nombre.value.trim(), ambiente: c.ambiente.value };
        if (b64 || c.clave.value) { cuerpo.certificadoBase64 = b64; cuerpo.claveCertificado = c.clave.value; }
        return llamar('POST', '/api/admin/empresas', cuerpo, 30000);
      }).then(function (d) {
        setTimeout(function () { mostrarClave(d.rnc, d.apiKey, 'Sus direcciones para la Oficina Virtual de la DGII: ' + location.host + '/' + d.rnc + ' en los tres campos.'); }, 60);
        return cargar();
      });
    });
  }

  /* ---------- carga y sesión */
  function meses(actual) {
    var lista = $('mes');
    if (lista.options.length) return;
    var d = new Date(); d.setUTCDate(1);
    for (var i = 0; i < 12; i++) {
      var o = el('option', '', d.toLocaleDateString('es-DO', { month: 'long', year: 'numeric', timeZone: 'UTC' }));
      o.value = d.toISOString().slice(0, 7);
      lista.appendChild(o);
      d.setUTCMonth(d.getUTCMonth() - 1);
    }
    lista.value = actual;
  }
  function mostrarEntrada(mensaje) {
    if (reloj) { clearInterval(reloj); reloj = null; }
    if ($('dialogo').open) $('dialogo').close();
    abierta = null; $('velo').hidden = true; $('ficha').hidden = true; document.body.style.overflow = '';
    franja('');
    $('panel').hidden = true; $('entrada').hidden = false;
    $('aviso').textContent = mensaje || '';
    $('clave').value = ''; $('clave').focus();
  }
  function programar() { if (!reloj) reloj = setInterval(function () { if (!$('dialogo').open) cargar(); }, 30000); }
  function cargar() {
    var mes = $('mes').value;
    return llamar('GET', '/api/admin/resumen' + (mes ? '?mes=' + encodeURIComponent(mes) : ''), undefined, 15000).then(function (d) {
      ultimaBien = Date.now(); datos = d;
      franja('');
      meses(d.mes);
      $('entrada').hidden = true; $('panel').hidden = false;
      pintar(d);
      programar();
    }, function (e) {
      if ($('panel').hidden) { if (!$('aviso').textContent) $('aviso').textContent = e.message; return; }
      // Se sigue viendo lo último que se supo, pero queda claro que el servicio no contesta
      franja('El servicio no responde' + (ultimaBien ? ' desde hace ' + Math.max(1, Math.round((Date.now() - ultimaBien) / 60000)) + ' min' : '') + '. Lo que ve puede estar desactualizado; se reintenta solo.');
      programar();
    });
  }

  $('formulario').addEventListener('submit', function (ev) { ev.preventDefault(); guardarClave($('clave').value.trim()); $('aviso').textContent = ''; cargar(); });
  $('nueva').addEventListener('click', nuevaEmpresa);
  $('mes').addEventListener('change', function () { if (abierta) invitacionDocumentos(); cargar(); });
  $('filtro').addEventListener('input', function () { if (datos) pintar(datos); });
  $('salir').addEventListener('click', function () { guardarClave(''); mostrarEntrada(''); });
  $('velo').addEventListener('click', cerrar);
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && abierta && !$('dialogo').open) cerrar(); });

  if (clave()) cargar(); else mostrarEntrada('');
})();
</script>
</body>
</html>
